# Local-development overlay — NEVER used in production (SRS §19.0/§19.1).
#
# The base docker-compose.yml deliberately publishes host ports for Nginx only;
# db and minio stay on the internal network. Host-run integration tests need to
# reach PostgreSQL directly, so this overlay publishes it — bound to 127.0.0.1,
# never 0.0.0.0, so nothing is exposed off the machine.
#
# It is a SEPARATE file, not docker-compose.override.yml, precisely so compose
# cannot merge it automatically: §19.1's deployment steps explicitly select
# the release overlay and must never pick this up.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Local dev holds fixture data only (§15.2, R-10), so a loopback-bound port
# carries no beneficiary-data exposure.

services:
  db:
    ports:
      # 5433, not 5432: a host PostgreSQL commonly occupies the default port,
      # and a silent connection to the WRONG database is far worse than a
      # port clash. Verified during M1.9 — the clash was real on this machine.
      - "127.0.0.1:5433:5432"

  minio:
    ports:
      # 9001 for the same reason (9000 was already taken on the dev host).
      - "127.0.0.1:9001:9000"

  nginx:
    # The base graph publishes both release-edge ports. Development replaces
    # that list rather than appending to it: its Nginx config intentionally
    # listens only on HTTP, and publishing an unserved host port 443 makes
    # Docker accept a browser's TLS connection only to reset it before any
    # request can reach Nginx. Publish the one Local HTTP edge on both
    # loopback families: browsers may resolve localhost to ::1 first, and an
    # IPv4-only bind then fails before Nginx can receive the navigation.
    ports: !override
      - "127.0.0.1:80:80"
      - "[::1]:80:80"
    volumes:
      # TD-13's rate limits key on the client IP, and the whole integration
      # suite arrives from one host — so the production ceiling that models a
      # *person* using the platform is exhausted by a test runner, and requests
      # start coming back `429 RATE_LIMITED`. That was the cause of a long-
      # standing intermittent failure in auth-refresh.http.integration.test.ts:
      # green in isolation, failing on different tests each full sweep.
      #
      # Only the ZONE RATES are replaced. Every `limit_req` directive, zone
      # assignment and burst in app-routing.conf stays exactly as production has
      # it, so a misrouted zone still fails here rather than in production.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # The release default fails closed to HTTPS even before a certificate is
      # issued. Localhost is the one HTTP exception and it exists only here.
      - ./nginx/dev/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/html:/usr/share/nginx/errors:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/snippets/rate-limits.dev.conf:/etc/nginx/snippets/rate-limits.conf:ro
      # R98 — the media server's origin for the CSP `connect-src`. Same
      # mechanism as the rate limits above and for the same reason: the
      # production file stays exactly what production ships, and development
      # substitutes one value rather than a different security posture.
      - ./nginx/snippets/media-origin.dev.conf:/etc/nginx/snippets/media-origin.conf:ro

  # ── R98: a REAL LiveKit server, locally, on no paid credentials ────────────
  #
  # `--dev` runs the whole signalling stack in one container with a fixed key
  # pair, which is what lets `verify-livekit-join` prove an actual join instead
  # of asserting that a mock was called. It is a DEV OVERLAY service and is
  # deliberately absent from docker-compose.yml: production points at LiveKit
  # Cloud (or a self-hosted deployment) through LIVEKIT_URL and never at this.
  #
  # **No Egress and no Redis.** Recording is Section C, and `--dev` carries
  # neither — see `docs/development/online-class-provider.md`, which recorded
  # that finding before this container existed.
  livekit:
    image: livekit/livekit-server:v1.9.1
    # **A config file, not `--dev`** (R99): the flag cannot express the Redis
    # address Egress needs to receive jobs, nor the webhook target that tells
    # the platform a recording finished. The key pair is fixed and committed ON
    # PURPOSE — it authorises nothing beyond these loopback containers, and a
    # generated one could not be written into .env.example.
    command: --config /etc/livekit.yaml
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      - redis
    ports:
      # The BROWSER connects to LiveKit directly, so unlike db and minio this
      # one has to be reachable from the host — that is what LIVEKIT_URL points
      # at in development (`ws://127.0.0.1:7880`). Loopback-bound, as everything
      # in this overlay is.
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"
    restart: unless-stopped

  # ── R99: Redis, and a REAL Egress worker ──────────────────────────────────
  #
  # `livekit-server --dev` records nothing: Egress is a SEPARATE service and it
  # needs Redis to receive jobs — the finding `online-class-provider.md` recorded
  # before either container existed, now paid for rather than rediscovered.
  #
  # Both are DEV-OVERLAY services and are deliberately absent from
  # docker-compose.yml. A production deployment points at LiveKit Cloud (or a
  # self-hosted stack) and does not run these; the API talks to whatever
  # LIVEKIT_URL names.
  redis:
    image: redis:8.2-alpine
    # Recording jobs are transient work, not data: an AOF/RDB file here would be
    # a durability promise nothing depends on.
    command: redis-server --save "" --appendonly no
    restart: unless-stopped

  # The Egress worker runs a headless browser to composite the room, which is
  # why the image is large and why it needs the shared-memory bump: the default
  # 64 MB /dev/shm makes Chrome crash part-way through a long lesson.
  livekit-egress:
    image: livekit/egress:v1.9.1
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./infra/egress/egress.yaml:/etc/egress.yaml:ro
    shm_size: 1gb
    # It reaches LiveKit and MinIO by SERVICE NAME on the internal network —
    # this is the architecture LiveKit Cloud cannot have, and it is why local
    # verification can write a real object into the platform's own MinIO while
    # a Cloud deployment must be ingested from the provider's bucket instead.
    depends_on:
      - redis
      - livekit
      - minio
    restart: unless-stopped
