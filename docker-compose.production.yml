# Production-only overlay (SRS §19.1).
#
# The checked-in template deliberately defaults to Development for safe local
# fixture work. A Production host must not depend on an operator remembering to
# change that line: this overlay makes the runtime tier structural.
#
# Object storage needs NO overlay here any more: `docker-compose.yml` already
# defines the one SeaweedFS model Localhost, Staging and Production all share
# (Owner decision, 2026-09-20). `docker-compose.release.yml` selects the
# exact-commit `minio-init` image for both Staging and Production alike. This
# file contains no secret.

services:
  api:
    environment:
      NODE_ENV: production
