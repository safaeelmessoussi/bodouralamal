# بذور الأمل platform — full stack (SRS §3.1, §16.1, §19.0/§19.1, TD-13).
# Dev:        docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Production: add release + production overlays and --no-build (§19.1; see runbook)
#
# App runtime config comes from .env (TD-13 inventory; cp .env.example .env).
# Container-bootstrap credentials (Postgres superuser password) live in
# infra.env (cp infra.env.example infra.env) — see the SRS-silence note in
# docs/CHANGES.log: TD-13 covers app config only; compose-level DB bootstrap
# is infrastructure, kept out of .env.example to preserve TD-13 lockstep.
#
# Image majors locked at M1 per §3.1a (see docs/CHANGES.log M1.1):
#   postgres 18 (floor 17; Debian variant — ICU required for ar-x-icu, TD-6a)
#   nginx stable branch
# Host ports (§19.1 as revised by SRS Revision 164): Nginx publishes 80/443, and
# the self-hosted media server publishes exactly TWO more — 7881/tcp and
# 7882/udp — because WebRTC media is not HTTP and cannot come through a web
# proxy. Those two are added by the release overlay, never here. Everything
# else — db, the object store, Redis, Egress, and the media server's own
# signalling port — is reachable on the internal network only.
#
# Object storage: ONE SeaweedFS 4.46 model for Localhost, Staging and
# Production (Owner decision, 2026-09-20 — see docs/architecture/storage.md).
# The `minio` service name and TD-13 `MINIO_*` setting names are kept for
# wire compatibility; the image, credentials and healthcheck beneath them are
# SeaweedFS's, identically in every tier. There is deliberately no separate
# storage overlay file to include or omit — the whole point of this revision
# is that no compose invocation can silently select a different backend.

name: bodour

x-bounded-local-logging: &bounded-local-logging
  # Docker's default json-file driver does not rotate. Keep `docker compose
  # logs` available without allowing one noisy service to exhaust the VPS disk.
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: bodour-api:dev
    build: ./backend
    # pg-boss gets 105 seconds to finish or durably return in-flight work,
    # leaving Docker 15 seconds for HTTP close, pool disconnect and exit. The
    # Compose default is only 10 seconds, which would SIGKILL the process before
    # its documented graceful shutdown could complete.
    stop_grace_period: 2m
    env_file: .env
    environment:
      TZ: ${TZ:-Africa/Casablanca}
      # TD-13 container memory pin (4 GB VPS budget)
      NODE_OPTIONS: --max-old-space-size=768
    volumes:
      # **Morocco's official time comes from the HOST** (SRS Revision 167 §2).
      # An image freezes its own zone data on the day it is built; Ubuntu keeps
      # the host's current. On 2026-09-20 Morocco moved to UTC+0 and the
      # platform stayed an hour ahead until this mount existed. Read-only, and
      # read by `lib/morocco-clock.ts`, which re-reads it when it changes.
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # `/healthz` is green only when DB, storage, queue infrastructure and the
      # complete live worker catalogue are ready. The runtime image carries curl.
      test: ["CMD", "curl", "-fsS", "--max-time", "12", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 13s
      retries: 4
      start_period: 30s
    logging: *bounded-local-logging
    restart: unless-stopped

  db:
    image: postgres:18.4
    # TD-13 pinned pool/memory budget — never left at defaults.
    command: >
      postgres -c max_connections=30
               -c shared_buffers=256MB
               -c work_mem=8MB
               -c statement_timeout=10s
    env_file: infra.env
    environment:
      TZ: ${TZ:-Africa/Casablanca}
      POSTGRES_USER: app
      POSTGRES_DB: bodour
    volumes:
      # The host's zone database (SRS Revision 167 §2), so an operator's `psql`
      # and any `AT TIME ZONE` read Morocco's CURRENT rules. The application
      # itself never depends on this: its own sessions are UTC (R166).
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      # PG 18+ images require the mount at /var/lib/postgresql (NOT .../data):
      # data lands in a major-version subdirectory, which is what keeps
      # `pg_upgrade --link` possible without mount-boundary issues. Mounting
      # at .../data makes the container refuse to start outright.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bodour"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *bounded-local-logging
    restart: unless-stopped

  # SeaweedFS 4.46, single-node `weed mini`, identically pinned for every tier
  # (Owner decision, 2026-09-20; selection/compatibility evidence:
  # docs/architecture/storage.md#b1-candidate-verification-checkpoint). The
  # service name `minio` and the `MINIO_*` setting names are kept only for
  # wire compatibility with TD-13 and the Nginx `/storage/` proxy — nothing
  # here is real MinIO. Telemetry, the Admin UI, WebDAV, Iceberg/Lance and
  # embedded IAM are disabled; automatic bucket creation is refused so only
  # the explicit `minio-init` initializer ever creates a bucket.
  minio:
    image: chrislusf/seaweedfs:4.46@sha256:08d516132314207d10c8e37cbffc1f32b147d870169688734cc61c6231625b62
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        test -n "$${AWS_ACCESS_KEY_ID}" || exit 1;
        test -n "$${AWS_SECRET_ACCESS_KEY}" || exit 1;
        exec weed mini -dir=/data -ip=127.0.0.1 -s3.port=9000
        -master.telemetry=false -admin.ui=false -webdav=false
        -s3.port.iceberg=0 -s3.port.lance=0 -s3.iam=false
        -s3.autoCreateBucket=false -s3.allowDeleteBucketNotEmpty=false
    environment:
      # No TZ here by design: S3 presigned-URL expiry is UTC by specification —
      # object storage needs no local wall clock. TD-11 wall-clock semantics
      # live in the api and db containers.
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?object-store credential required}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?object-store credential required}
      # TD-13 container memory pin
      GOMEMLIMIT: 512MiB
    volumes:
      # The image contains an empty filerldb2 directory. Do not copy image
      # scaffolding into a fresh volume: restore requires a truly empty target.
      - type: volume
        source: minio-data
        target: /data
        volume:
          nocopy: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    logging: *bounded-local-logging
    restart: unless-stopped

  # One-shot: creates the §3.1 dual buckets (plus the R99 recording-staging
  # third) and their policies, idempotently, through the same AWS SDK the
  # application itself uses. Container liveness is not acceptance: this
  # checks authenticated access and refuses versioning/lifecycle/Object Lock
  # drift rather than silently clearing it (docs/architecture/storage.md).
  # public  → anonymous download (stable URLs behind Nginx)
  # private → no anonymous access; presigned URLs only (TD-12)
  minio-init:
    image: ${BODOUR_STORAGE_INIT_IMAGE:-bodour-api:dev}
    entrypoint: ["node", "/app/storage-init.mjs"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?object-store credential required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?object-store credential required}
      # R99 — a THIRD bucket, and it is neither of the content two. The
      # recording facility writes here; the platform verifies the object and
      # only then does it enter the content lifecycle. It carries no
      # anonymous policy, like `private`: nothing here is ever served,
      # because nothing here has been verified yet (R99.13).
      RECORDING_STAGING_BUCKET: ${RECORDING_STAGING_BUCKET:-recordings-staging}
    volumes:
      - ./scripts/storage/initialize.mjs:/app/storage-init.mjs:ro
      - ./scripts/storage/policy.mjs:/app/policy.mjs:ro
    logging: *bounded-local-logging

  nginx:
    image: bodour-web:dev
    build: ./frontend
    # **Reload periodically, or the renewal never reaches the browser.**
    # `certbot renew` writes a new certificate to disk; nginx keeps the old one
    # in memory until it reloads. Without this the certificate renews on the
    # 12-hour loop below, the file on disk is current, and the site serves an
    # expired certificate anyway — a failure that looks like certbot's and is
    # not. Six hours is well inside Let's Encrypt's 30-day renewal window.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/html:/usr/share/nginx/errors:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - minio
    logging: *bounded-local-logging
    restart: unless-stopped

  # ── Online classes: SELF-HOSTED, and the same three services on every tier ──
  #
  # SRS Revision 164 (Owner decision, 2026-09-20): Localhost, Staging and
  # Production run one media architecture — LiveKit, its Egress recorder and the
  # Redis they coordinate through — and beneficiaries' audio, video and
  # recordings never leave this infrastructure. No LiveKit Cloud, no third-party
  # STUN/TURN, no external bucket: Egress writes each recording straight into
  # THIS deployment's object store over the internal network (`minio:9000`),
  # using the target the API hands it per request (`online-class-provider.ts`).
  #
  # Defined HERE, not in an overlay, for the reason object storage is: a tier
  # must not run a different media model because a file was included or omitted.
  # The API does not `depends_on` any of them — the platform serves everything
  # else while the media server is down, and says so on «دخول الحصة» (R98).
  livekit:
    image: livekit/livekit-server:v1.9.1
    environment:
      # The whole configuration, with NO secret in it: the key pair arrives
      # separately through LIVEKIT_KEYS, so nothing in Git or in
      # `docker compose config` of this block names a credential.
      LIVEKIT_CONFIG: |
        port: 7880
        bind_addresses:
          - "0.0.0.0"
        rtc:
          tcp_port: 7881
          # ONE multiplexed UDP port for every participant, so the firewall
          # opens a single UDP port rather than a range.
          udp_port: 7882
          # Never ask a public STUN server (Google's, by default) what this
          # host's address is: release tiers STATE it (NODE_IP below).
          use_external_ip: false
          # **And never hand one to a client either.** With this list empty the
          # server sends every browser — and the recorder — Twilio's and
          # Google's public STUN servers (found on Staging, 2026-09-20, in the
          # browser's own RTCPeerConnection). There is no "none" setting, so the
          # one address named is on THIS host: nothing third-party is contacted.
          #
          # **Port 3478, where nothing listens — deliberately NOT the media port.**
          # Naming 7882 was tried first and measured from outside, A/B, twice: a
          # browser's plain STUN request to the media port spoils that port's
          # handling of the same client's real connection, and media fell back to
          # TCP every time. A dead port costs a client nothing — a publicly
          # addressed media server is reached without STUN — and media stays on
          # UDP. 3478 is not published and not opened in any firewall.
          stun_servers:
            - ${LIVEKIT_NODE_IP:-127.0.0.1}:3478
        redis:
          address: redis:6379
        webhook:
          api_key: ${LIVEKIT_API_KEY:-}
          urls:
            - http://api:3000/api/v1/integrations/online-class/callback
        logging:
          level: info
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
      # The address browsers are told to send media to. Release tiers set the
      # host's public IPv4 (host preflight holds it to the approved one);
      # Localhost leaves it empty and the container's own address is
      # advertised, which the same machine's browser reaches directly.
      NODE_IP: ${LIVEKIT_NODE_IP:-}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7880/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *bounded-local-logging
    restart: unless-stopped

  # Room and recording state shared between the media server and Egress.
  # Ephemeral by design: it persists nothing and a restart loses no recording —
  # the recording's own lifecycle lives in PostgreSQL.
  redis:
    image: redis:8.2-alpine
    command: redis-server --save "" --appendonly no --maxmemory 48mb --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *bounded-local-logging
    restart: unless-stopped

  # The recorder. It joins a room as a hidden participant, composites it in a
  # headless browser and uploads the finished file to the object store.
  livekit-egress:
    image: livekit/egress:v1.9.1
    # A shell in front of the image's own entrypoint, for one reason: the CPU
    # costs below differ per tier and Compose can only merge them as container
    # environment, which Egress does not read — so they are written into its
    # config here. `set -e` only, never `-x`: this script holds the API secret.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        test -n "$${LIVEKIT_API_KEY}" || { echo "egress: LIVEKIT_API_KEY is required" >&2; exit 1; }
        test -n "$${LIVEKIT_API_SECRET}" || { echo "egress: LIVEKIT_API_SECRET is required" >&2; exit 1; }
        export EGRESS_CONFIG_BODY="
        api_key: $${LIVEKIT_API_KEY}
        api_secret: $${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        insecure: true
        health_port: 9090
        log_level: info
        redis:
          address: redis:6379
        cpu_cost:
          room_composite_cpu_cost: $${EGRESS_VIDEO_CPU_COST}
          audio_room_composite_cpu_cost: $${EGRESS_AUDIO_CPU_COST}
          web_cpu_cost: $${EGRESS_VIDEO_CPU_COST}
          audio_web_cpu_cost: $${EGRESS_AUDIO_CPU_COST}
          participant_cpu_cost: $${EGRESS_VIDEO_CPU_COST}
          track_composite_cpu_cost: $${EGRESS_VIDEO_CPU_COST}
          track_cpu_cost: $${EGRESS_AUDIO_CPU_COST}
        "
        exec /entrypoint.sh
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # **What Egress believes a recording costs, in CPU cores — MEASURED, not
      # the upstream default** (2026-09-20, `online-class-provider.md`). Egress
      # refuses a request when fewer than this many cores are idle, and its
      # default for a room recording is 4: on a 2-vCPU host every VIDEO
      # recording was refused with `503` while audio worked. A real 720p/30
      # room recording peaks at ~1.9 cores and ~700 MiB; an audio-only one
      # settles at ~0.3 core and ~360 MiB. These are the general values; a
      # smaller tier states its own in its overlay.
      EGRESS_VIDEO_CPU_COST: "2.0"
      EGRESS_AUDIO_CPU_COST: "1.0"
    # The compositing browser crashes part-way through a long lesson on Docker's
    # default 64 MB of shared memory (found in R99, not assumed).
    shm_size: 1gb
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 20s
    logging: *bounded-local-logging
    restart: unless-stopped

  # Production only (§19.1): activate through the exact-commit release overlay.
  certbot:
    image: certbot/certbot
    profiles: ["production"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    logging: *bounded-local-logging
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
    # Logical name preserved for backup tooling and the recovery-point
    # manifest; physical name reflects what actually lives there (SeaweedFS,
    # never a raw MinIO-format mount).
    name: ${COMPOSE_PROJECT_NAME:?compose project required}_seaweedfs-data
  certbot-www:
  certbot-conf:
