# بذور الأمل platform — full stack (SRS §3.1, §16.1, §19.0/§19.1, TD-13).
# Dev:        docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# Production: add release + production overlays and --no-build (§19.1; see runbook)
#
# App runtime config comes from .env (TD-13 inventory; cp .env.example .env).
# Container-bootstrap credentials (Postgres superuser password) live in
# infra.env (cp infra.env.example infra.env) — see the SRS-silence note in
# docs/CHANGES.log: TD-13 covers app config only; compose-level DB bootstrap
# is infrastructure, kept out of .env.example to preserve TD-13 lockstep.
#
# Image majors locked at M1 per §3.1a (see docs/CHANGES.log M1.1):
#   postgres 18 (floor 17; Debian variant — ICU required for ar-x-icu, TD-6a)
#   minio RELEASE.2025-09-07 (latest stable at lock time)
#   nginx stable branch
# Only Nginx publishes host ports — db/minio are reachable exclusively on the
# internal network (§19.1 posture; local tooling uses `docker compose exec`).

name: bodour

x-bounded-local-logging: &bounded-local-logging
  # Docker's default json-file driver does not rotate. Keep `docker compose
  # logs` available without allowing one noisy service to exhaust the VPS disk.
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    image: bodour-api:dev
    build: ./backend
    # pg-boss gets 105 seconds to finish or durably return in-flight work,
    # leaving Docker 15 seconds for HTTP close, pool disconnect and exit. The
    # Compose default is only 10 seconds, which would SIGKILL the process before
    # its documented graceful shutdown could complete.
    stop_grace_period: 2m
    env_file: .env
    environment:
      TZ: ${TZ:-Africa/Casablanca}
      # TD-13 container memory pin (4 GB VPS budget)
      NODE_OPTIONS: --max-old-space-size=768
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      # `/healthz` is green only when DB, storage, queue infrastructure and the
      # complete live worker catalogue are ready. The runtime image carries curl.
      test: ["CMD", "curl", "-fsS", "--max-time", "12", "http://127.0.0.1:3000/healthz"]
      interval: 15s
      timeout: 13s
      retries: 4
      start_period: 30s
    logging: *bounded-local-logging
    restart: unless-stopped

  db:
    image: postgres:18.4
    # TD-13 pinned pool/memory budget — never left at defaults.
    command: >
      postgres -c max_connections=30
               -c shared_buffers=256MB
               -c work_mem=8MB
               -c statement_timeout=10s
    env_file: infra.env
    environment:
      TZ: ${TZ:-Africa/Casablanca}
      POSTGRES_USER: app
      POSTGRES_DB: bodour
    volumes:
      # PG 18+ images require the mount at /var/lib/postgresql (NOT .../data):
      # data lands in a major-version subdirectory, which is what keeps
      # `pg_upgrade --link` possible without mount-boundary issues. Mounting
      # at .../data makes the container refuse to start outright.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bodour"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *bounded-local-logging
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      # No TZ here by design: the MinIO image ships without tzdata (TZ would be
      # silently ignored), and S3 presigned-URL expiry is UTC by specification —
      # object storage needs no local wall clock. TD-11 wall-clock semantics
      # live in the api and db containers.
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      # TD-13 container memory pin
      GOMEMLIMIT: 512MiB
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *bounded-local-logging
    restart: unless-stopped

  # One-shot: creates the §3.1 dual buckets and their policies, idempotently.
  # public  → anonymous download (stable URLs behind Nginx)
  # private → no anonymous access; presigned URLs only (TD-12)
  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      # MC_HOST_<alias> is mc's documented credential channel — it keeps the
      # secret out of the container command line, so it never surfaces in
      # `docker compose config`, `docker inspect`, or a process list (TD-13:
      # secrets never appear in logs or payloads).
      MC_HOST_local: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@minio:9000
      # R99 — a THIRD bucket, and it is neither of the content two. The
      # recording facility writes here; the platform verifies the object and
      # only then does it enter the content lifecycle. `anonymous set none`
      # like `private`: nothing here is ever served, because nothing here has
      # been verified yet (R99.13).
      RECORDING_STAGING_BUCKET: ${RECORDING_STAGING_BUCKET:-recordings-staging}
    entrypoint: >
      /bin/sh -c "
      mc mb --ignore-existing local/public &&
      mc mb --ignore-existing local/private &&
      mc mb --ignore-existing local/$${RECORDING_STAGING_BUCKET:-recordings-staging} &&
      mc anonymous set download local/public &&
      mc anonymous set none local/private &&
      mc anonymous set none local/$${RECORDING_STAGING_BUCKET:-recordings-staging} &&
      echo 'MinIO buckets ready (public: anonymous download; private + staging: presigned-only)'
      "
    logging: *bounded-local-logging

  nginx:
    image: bodour-web:dev
    build: ./frontend
    # **Reload periodically, or the renewal never reaches the browser.**
    # `certbot renew` writes a new certificate to disk; nginx keeps the old one
    # in memory until it reloads. Without this the certificate renews on the
    # 12-hour loop below, the file on disk is current, and the site serves an
    # expired certificate anyway — a failure that looks like certbot's and is
    # not. Six hours is well inside Let's Encrypt's 30-day renewal window.
    command: >
      /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g 'daemon off;'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/html:/usr/share/nginx/errors:ro
      - certbot-www:/var/www/certbot:ro
      - certbot-conf:/etc/letsencrypt:ro
    depends_on:
      - api
      - minio
    logging: *bounded-local-logging
    restart: unless-stopped

  # Production only (§19.1): activate through the exact-commit release overlay.
  certbot:
    image: certbot/certbot
    profiles: ["production"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    entrypoint: >
      /bin/sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    logging: *bounded-local-logging
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
  certbot-www:
  certbot-conf:
