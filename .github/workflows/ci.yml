# CI skeleton — SRS §19.2 gates (M0 scope: lint, typecheck, test runners,
# TD-6a migration-presence check, `db push` ban, .env commit check, TD-6b
# DROP/RENAME migration lint, OpenAPI↔TD-3 conformance).
# Later milestones extend this file (testcontainers integration tests, TD-2
# permission-matrix API tests, Playwright E2E, ≥80% coverage on /services and
# /policies) — extensions are dedicated tasks, recorded in docs/CHANGES.log.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  guards:
    name: SRS guard checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .env committed (§20 rule 18)
        run: bash scripts/ci/check-env-not-committed.sh
      - name: prisma db push ban (TD-6a)
        run: bash scripts/ci/check-no-db-push.sh
      - name: Hand-written migration SQL presence (TD-6a)
        run: bash scripts/ci/check-migrations.sh
      - name: DROP/RENAME migration lint (TD-6b)
        run: bash scripts/ci/check-migration-drop-rename.sh
      # Prisma applies migrations in FILENAME order. A migration referencing a
      # column added by a later-named one works on every existing database and
      # fails on an empty one — i.e. exactly once, at the first production
      # deploy. See docs/architecture/database.md.
      - name: Migration ordering (TD-6a)
        run: bash scripts/ci/check-migration-order.sh
      - name: Prisma mass-write filter guard
        run: bash scripts/ci/check-prisma-mass-write.sh
      - name: Header navigation exclusivity (burger vs horizontal nav)
        run: bash scripts/ci/check-header-nav-exclusive.sh
      - name: Design-token discipline (components use semantic tokens only)
        run: bash scripts/ci/check-design-tokens.sh
      - name: Public display identity resolved server-side (§7, §20 rule 21)
        run: bash scripts/ci/check-display-identity.sh
      # R60 shipped two defects from reading the account's full role list where
      # the active role was meant, and both type-checked — only a rule about
      # WHICH list may be read can catch the next one.
      - name: Presentation reads the active role, not the account's roles (R60)
        run: bash scripts/ci/check-active-role-presentation.sh
      # A response shape nobody chose is still a contract once a client depends
      # on it, and the drift is silent: adding a column to a model changes the
      # API without changing a test.
      - name: Contract DTOs — no ORM entity on the wire (§16.2, Revision 38)
        run: bash scripts/ci/check-contract-dto.sh
      # The documentation hierarchy is built on cross-references rather than
      # duplication, so a broken link degrades "single source of truth" into
      # "the truth is somewhere". Link integrity is mechanically checkable and
      # is therefore mechanically checked; accuracy is what review is for.
      - name: Documentation link integrity
        run: bash scripts/ci/check-doc-links.sh

  contract:
    name: API contract — regenerate and verify no drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # Regenerate FROM THE IMPLEMENTATION, then fail if the committed document
      # differs. Without this the gate below would be validating a file a human
      # could hand-edit — exactly what §3.1 forbids ("never hand-edited to fix a
      # mismatch"). Regenerating here is what makes docs/openapi.json a
      # generated artifact in fact and not merely by intention.
      - name: Regenerate docs/openapi.json
        run: npm run openapi:generate
        working-directory: backend
      - name: Fail if the committed contract is stale or hand-edited
        run: |
          if ! git diff --exit-code docs/openapi.json; then
            echo "::error::docs/openapi.json is out of date or was hand-edited."
            echo "Run 'npm --prefix backend run openapi:generate' and commit the result."
            exit 1
          fi
      # The currency half, and it is a DIFFERENT question from the gate below.
      # The gate compares the committed document against the registry and passes
      # while that document is months out of date. This one asks whether it
      # describes the API actually served. The step above catches the same drift
      # in CI, but its failure surfaces under a step named "Regenerate", which
      # reads as a build error rather than a contract gap — and nothing local
      # ran the generator at all, which is how the document went stale from
      # ed7212b to 4842def with every guard green.
      - name: docs/openapi.json is current with the served API (§3.1)
        run: bash scripts/ci/check-openapi-current.sh
      - name: OpenAPI ↔ documented-endpoint registry conformance (§3.1)
        run: bash scripts/ci/check-openapi-td3.sh

  backend:
    name: Backend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
