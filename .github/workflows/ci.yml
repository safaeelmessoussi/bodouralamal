# CI — SRS §19.2 gates (lint, typecheck, test runners, production builds,
# TD-6a migration-presence check, `db push` ban, .env commit check, TD-6b
# DROP/RENAME migration lint, OpenAPI↔TD-3 conformance).
# Later milestones extend this file (testcontainers integration tests, TD-2
# permission-matrix API tests, Playwright E2E, ≥80% coverage on /services and
# /policies) — extensions are dedicated tasks, recorded in docs/CHANGES.log.
name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  guards:
    name: SRS guard checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No .env committed (§20 rule 18)
        run: bash scripts/ci/check-env-not-committed.sh
      - name: prisma db push ban (TD-6a)
        run: bash scripts/ci/check-no-db-push.sh
      - name: Hand-written migration SQL presence (TD-6a)
        run: bash scripts/ci/check-migrations.sh
      - name: DROP/RENAME migration lint (TD-6b)
        run: bash scripts/ci/check-migration-drop-rename.sh
      # Prisma applies migrations in FILENAME order. A migration referencing a
      # column added by a later-named one works on every existing database and
      # fails on an empty one — i.e. exactly once, at the first production
      # deploy. See docs/architecture/database.md.
      - name: Migration ordering (TD-6a)
        run: bash scripts/ci/check-migration-order.sh
      # A guard that has never failed is indistinguishable from no guard. This
      # one was restated in R109 after a false positive, so it now carries a
      # self-test that reconstructs the R36.1 defect and requires the guard to
      # report it — and requires it NOT to report the correctly ordered pair.
      - name: Migration-ordering guard proves itself against R36.1
        run: bash scripts/ci/check-migration-order.selftest.sh
      - name: Prisma mass-write filter guard
        run: bash scripts/ci/check-prisma-mass-write.sh
      - name: Header navigation exclusivity (burger vs horizontal nav)
        run: bash scripts/ci/check-header-nav-exclusive.sh
      - name: Design-token discipline (components use semantic tokens only)
        run: bash scripts/ci/check-design-tokens.sh
      - name: Closed dialogs stay out of layout until opened
        run: bash scripts/ci/check-dialog-hidden-when-closed.sh
      - name: Progress meters keep logical RTL-safe sizing
        run: bash scripts/ci/check-progress-css.sh
      - name: Shared page-header and button layout invariants
        run: bash scripts/ci/check-shared-layout.sh
      - name: Every Nginx header set carries HSTS
        run: bash scripts/ci/check-security-headers.sh
      - name: Operational and audit logs contain no caller-supplied PII
        run: bash scripts/ci/check-no-pii-logs.sh
      - name: The hero logo is a cleanly matted cut-out
        run: bash scripts/ci/check-logo-alpha.sh
      # Guards are protection only if they can fail. Three shipped depending on
      # ripgrep, and their prohibition checks passed silently where it is absent.
      - name: CI guards search with POSIX grep, so none can fail open
        run: bash scripts/ci/check-ci-portability.sh
      - name: Every MinIO proxy path carries the defensive edge policy
        run: bash scripts/ci/check-storage-edge.sh
      - name: Backup tooling stays encrypted, resident and fail-closed
        run: bash scripts/ci/check-backup-tooling.sh
      - name: Releases use exact-commit artifacts and never target-host builds
        run: bash scripts/ci/check-release-artifacts.sh
      - name: Every Production service uses bounded local logs
        run: bash scripts/ci/check-compose-operations.sh
      - name: Storage retirement stays durable and automatic destruction stays disabled
        run: bash scripts/ci/check-storage-lifecycle.sh
      - name: Association terminology remains consistent
        run: bash scripts/ci/check-association-terminology.sh
      - name: Arabic UI uses Western numerals
        run: bash scripts/ci/check-western-digits.sh
      - name: Public display identity resolved server-side (§7, §20 rule 21)
        run: bash scripts/ci/check-display-identity.sh
      # R60 shipped two defects from reading the account's full role list where
      # the active role was meant, and both type-checked — only a rule about
      # WHICH list may be read can catch the next one.
      - name: Presentation reads the active role, not the account's roles (R60)
        run: bash scripts/ci/check-active-role-presentation.sh
      # A response shape nobody chose is still a contract once a client depends
      # on it, and the drift is silent: adding a column to a model changes the
      # API without changing a test.
      - name: Contract DTOs — no ORM entity on the wire (§16.2, Revision 38)
        run: bash scripts/ci/check-contract-dto.sh
      # R97.9 makes provider-independence normative, and a rule like that erodes
      # rather than breaks: one convenient import in a service, then a vendor's
      # name in a heading, and the SRS is describing a codebase that has moved.
      - name: The online-class provider seam stays one file (R97.9, R98)
        run: bash scripts/ci/check-provider-seam.sh
      # The documentation hierarchy is built on cross-references rather than
      # duplication, so a broken link degrades "single source of truth" into
      # "the truth is somewhere". Link integrity is mechanically checkable and
      # is therefore mechanically checked; accuracy is what review is for.
      - name: Documentation link integrity
        run: bash scripts/ci/check-doc-links.sh

  contract:
    name: API contract — regenerate and verify no drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      # Same reason as the backend job: the generator imports the client it
      # describes, so a clean checkout has nothing to generate the contract from.
      - run: npx prisma generate
        working-directory: backend
      # Regenerate FROM THE IMPLEMENTATION, then fail if the committed document
      # differs. Without this the gate below would be validating a file a human
      # could hand-edit — exactly what §3.1 forbids ("never hand-edited to fix a
      # mismatch"). Regenerating here is what makes docs/openapi.json a
      # generated artifact in fact and not merely by intention.
      - name: Regenerate docs/openapi.json
        run: npm run openapi:generate
        working-directory: backend
      - name: Fail if the committed contract is stale or hand-edited
        run: |
          if ! git diff --exit-code docs/openapi.json; then
            echo "::error::docs/openapi.json is out of date or was hand-edited."
            echo "Run 'npm --prefix backend run openapi:generate' and commit the result."
            exit 1
          fi
      # The currency half, and it is a DIFFERENT question from the gate below.
      # The gate compares the committed document against the registry and passes
      # while that document is months out of date. This one asks whether it
      # describes the API actually served. The step above catches the same drift
      # in CI, but its failure surfaces under a step named "Regenerate", which
      # reads as a build error rather than a contract gap — and nothing local
      # ran the generator at all, which is how the document went stale from
      # ed7212b to 4842def with every guard green.
      - name: docs/openapi.json is current with the served API (§3.1)
        run: bash scripts/ci/check-openapi-current.sh
      - name: OpenAPI ↔ documented-endpoint registry conformance (§3.1)
        run: bash scripts/ci/check-openapi-td3.sh

  backend:
    name: Backend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # **`prisma generate` is a BUILD STEP, not a developer convenience.**
      # `src/generated/prisma/**` is gitignored, so on a clean checkout it does
      # not exist and every file importing the client fails to typecheck —
      # `TS2307` followed by a cascade of `TS7006` on every parameter whose type
      # came from it. It passed locally only because a working tree already had
      # the client, which is the same blindness that hid a broken lockfile: local
      # green and CI green were never the same thing.
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    name: Frontend — lint, typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  release-images:
    name: Release — publish exact-commit API and web images
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [guards, contract, backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" |
            docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish the exact-commit API image
        run: |
          set -euo pipefail
          image_base="$(printf '%s' "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="$image_base-api:$GITHUB_SHA"
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" \
            backend
          docker push "$image"
      - name: Build and publish the exact-commit web image
        run: |
          set -euo pipefail
          image_base="$(printf '%s' "ghcr.io/$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image="$image_base-web:$GITHUB_SHA"
          docker build \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image" \
            frontend
          docker push "$image"
