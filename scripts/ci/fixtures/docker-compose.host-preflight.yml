# Synthetic configuration for the dependency-free host-preflight guard. It
# resets operator files and changes no topology, image, port, volume, log or
# restart rule: those must come from the real release model under test.
services:
  api:
    env_file: !reset []
    environment:
      DATABASE_URL: postgresql://app:preflight-password@db:5432/bodour
      GOOGLE_CLIENT_ID: preflight-client.apps.invalid
      GOOGLE_CLIENT_SECRET: preflight-client-secret
      JWT_SIGNING_KEY: preflight-jwt-signing-key-more-than-thirty-two-bytes
      ONBOARDING_TOKEN_KEY: preflight-onboarding-key-more-than-thirty-two-bytes
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: preflight-access
      MINIO_SECRET_KEY: preflight-secret-password
      PUBLIC_BASE_URL: https://preflight.invalid
      STORAGE_BASE_URL: https://preflight.invalid/storage
      SUPER_ADMIN_EMAIL: safae.elmessoussi@gmail.com
      SUPER_ADMIN_SEX: female
      BACKUP_TARGET_SSH: restic@backup.invalid:/srv/bodour-preflight

  db:
    env_file: !reset []
    environment:
      POSTGRES_PASSWORD: preflight-password

  minio:
    environment:
      MINIO_ROOT_USER: preflight-access
      MINIO_ROOT_PASSWORD: preflight-secret-password

  minio-init:
    environment:
      MC_HOST_local: http://preflight-access:preflight-secret-password@minio:9000
