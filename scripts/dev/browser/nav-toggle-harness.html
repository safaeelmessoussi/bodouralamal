<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="APP_CSS">
<style>body{margin:0}</style></head><body>
<div class="admin" id="shell">
  <!-- **R138 correction #5** — the toggle now lives WITH the sidebar, in its
       own `admin-nav-region` wrapper occupying the SAME grid slot
       `.admin-nav` used to occupy alone — never inside the page header's
       `.admin__actions`. Sized like the real `<Button icon="sidebar">` this
       button actually renders, so the harness measures a realistic width. -->
  <div class="admin-nav-region">
    <button type="button" class="btn btn--secondary admin-nav-toggle" id="toggle" aria-expanded="true" aria-controls="admin-sidebar">
      <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4V4zM15 4v16" stroke="currentColor" stroke-width="1.75" fill="none"/></svg>
      <span id="toggle-label">إخفاء أقسام الإدارة</span>
    </button>
    <!-- **R138 correction #4** — POPULATED, not a two-item stub: the defect
         (a `.admin-nav` computing `display: none` while nested inside the
         open `.admin-nav-panel`) is invisible to a list short enough to
         render as `0×0` without anyone noticing anything is missing at a
         glance. Seven items, the exact count and order of a real Student
         menu (`student.nav.*` in `ar.ts`), with the first marked
         `aria-current="page"` as the active destination always is. -->
    <nav class="admin-nav" id="admin-sidebar"><ul class="admin-nav__list">
      <li><a class="admin-nav__item" href="/one" id="link1" aria-current="page">لوحة المستفيدة</a></li>
      <li><a class="admin-nav__item" href="/two" id="link2">تقويمي</a></li>
      <li><a class="admin-nav__item" href="/three" id="link3">مكتبة المحتوى</a></li>
      <li><a class="admin-nav__item" href="/four" id="link4">حفظي</a></li>
      <li><a class="admin-nav__item" href="/five" id="link5">اختباراتي</a></li>
      <li><a class="admin-nav__item" href="/six" id="link6">نقاطي</a></li>
      <li><a class="admin-nav__item" href="/seven" id="link7">حسابي</a></li>
    </ul></nav>
  </div>
  <main class="admin__main" id="main">
    <div class="admin__head">
      <div class="admin__heading"><h1 class="admin__title">عنوان الصفحة</h1></div>
      <div class="admin__actions">
        <!-- **R138 correction #5** — page-specific actions only; the toggle
             moved out to `.admin-nav-region` above. -->
        <button type="button" class="btn btn--primary btn--add" id="page-action"><span aria-hidden="true">+</span>إضافة عنصر</button>
      </div>
    </div>
    <p id="content">محتوى الصفحة الفعلي.</p>
  </main>
</div>
<script>
  // A minimal replica of `PortalShell`'s own toggle state machine (see its
  // doc comment) — enough to drive the CSS invariants in isolation, with no
  // React/backend/auth required. The class names, the three states (`null`
  // | 'collapsed' | 'overlay') and — since R138 correction #2, restructured
  // by correction #5 — the DOM surgery itself (`.admin-nav` moves INTO a
  // freshly built `.admin-nav-panel` wrapper only while the overlay is open,
  // leaving `.admin-nav-region` holding just the toggle, exactly as
  // `PortalShell` only ever renders the panel conditionally) are what the
  // real component does; nothing here is a simplification of a property
  // being tested.
  const shell = document.getElementById('shell');
  const navRegion = document.querySelector('.admin-nav-region');
  const nav = document.getElementById('admin-sidebar');
  const main = document.getElementById('main');
  let state = null;
  let panel = null;
  let backdrop = null;

  function visible() {
    if (state === 'overlay') return true;
    if (state === 'collapsed') return false;
    return window.matchMedia('(min-width: 60rem)').matches;
  }

  function buildPanel() {
    const p = document.createElement('div');
    p.className = 'admin-nav-panel';
    const head = document.createElement('div');
    head.className = 'admin-nav-panel__head';
    const title = document.createElement('span');
    title.className = 'admin-nav-panel__title';
    title.textContent = 'أقسام الإدارة';
    const close = document.createElement('button');
    close.type = 'button';
    close.id = 'panel-close';
    close.className = 'icon-button';
    close.innerHTML =
      '<span class="visually-hidden">إغلاق القائمة</span>' +
      '<svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.75" fill="none"/></svg>';
    close.addEventListener('click', () => {
      state = 'collapsed';
      apply();
    });
    head.appendChild(title);
    head.appendChild(close);
    p.appendChild(head);
    p.appendChild(nav);
    return p;
  }

  function apply() {
    shell.className = state === null ? 'admin' : 'admin admin--nav-' + state;

    // Mirror `PortalShell`'s own conditional JSX exactly: the panel wrapper
    // and the backdrop exist in the DOM ONLY while `state === 'overlay'`.
    if (state === 'overlay' && !panel) {
      panel = buildPanel();
      shell.insertBefore(panel, main);
      backdrop = document.createElement('button');
      backdrop.type = 'button';
      backdrop.id = 'backdrop';
      backdrop.className = 'admin-nav-backdrop';
      backdrop.setAttribute('aria-hidden', 'true');
      backdrop.tabIndex = -1;
      backdrop.addEventListener('click', () => {
        state = 'collapsed';
        apply();
      });
      shell.insertBefore(backdrop, panel);
    } else if (state !== 'overlay' && panel) {
      navRegion.appendChild(nav);
      panel.remove();
      panel = null;
      backdrop.remove();
      backdrop = null;
    }

    document.getElementById('toggle').setAttribute('aria-expanded', String(visible()));
  }

  document.getElementById('toggle').addEventListener('click', () => {
    state = visible() ? 'collapsed' : 'overlay';
    apply();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && state === 'overlay') {
      state = 'collapsed';
      apply();
    }
  });
  // A real nav-item is a plain full-page `<a href>` (see `nav-item.tsx`), so
  // following it closes the overlay by leaving the page entirely — the
  // harness approximates that one property without actually navigating away.
  for (const a of document.querySelectorAll('.admin-nav__item')) {
    a.addEventListener('click', (e) => {
      e.preventDefault();
      window.__lastNavClicked = a.id;
      state = 'collapsed';
      apply();
    });
  }
  window.__setNavState = (s) => {
    state = s;
    apply();
  };
  window.__navState = () => state;
  apply();
</script>
</body></html>
