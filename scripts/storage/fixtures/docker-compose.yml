name: bodour-storage-lifecycle-drill

services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: lifecycle-drill-password
      POSTGRES_DB: bodour
    ports:
      - "127.0.0.1:${STORAGE_LIFECYCLE_DB_PORT:-55436}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bodour"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    extends:
      file: ../../../docker-compose.storage.yml
      service: minio
    ports:
      - "127.0.0.1:${STORAGE_LIFECYCLE_MINIO_PORT:-59003}:9000"

volumes:
  db-data:
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:?compose project required}_seaweedfs-data
