name: bodour-storage-lifecycle-drill

services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: lifecycle-drill-password
      POSTGRES_DB: bodour
    ports:
      - "${STORAGE_LIFECYCLE_DB_PORT:-55436}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bodour"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    # Test-only compatibility fixture. Production remains blocked on the P0.1
    # supported-object-store Owner decision.
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: lifecycle-drill-access
      MINIO_ROOT_PASSWORD: lifecycle-drill-secret-password
    ports:
      - "${STORAGE_LIFECYCLE_MINIO_PORT:-59003}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://lifecycle-drill-access:lifecycle-drill-secret-password@minio:9000
    entrypoint: >
      /bin/sh -c "
      mc mb --ignore-existing local/public &&
      mc mb --ignore-existing local/private
      "

volumes:
  db-data:
  minio-data:
