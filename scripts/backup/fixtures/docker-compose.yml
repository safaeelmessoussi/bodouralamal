name: bodour-backup-drill

services:
  api:
    image: alpine:3.22
    command: ["sleep", "infinity"]
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: backup-drill-password
      POSTGRES_DB: bodour
    volumes:
      - db-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bodour"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio:
    extends:
      file: ../../../docker-compose.storage.yml
      service: minio

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://backup-drill-access:backup-drill-secret-password@minio:9000
    entrypoint: >
      /bin/sh -c "
      mc mb --ignore-existing local/public &&
      mc mb --ignore-existing local/private &&
      printf 'object-at-recovery-point' | mc pipe local/private/drill/object.txt
      "

volumes:
  db-data:
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:?compose project required}_seaweedfs-data
