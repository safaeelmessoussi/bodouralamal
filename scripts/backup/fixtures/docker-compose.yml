name: bodour-backup-drill

services:
  api:
    image: alpine:3.22
    command: ["sleep", "infinity"]
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy

  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: backup-drill-password
      POSTGRES_DB: bodour
    volumes:
      - db-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bodour"]
      interval: 2s
      timeout: 2s
      retries: 20

  minio:
    extends:
      file: ../../../docker-compose.yml
      service: minio
    # Loopback only: the drill seeds and reads back its canary object from the
    # host with the backend's own S3 SDK, so no client image is pulled.
    ports:
      - "127.0.0.1:${BACKUP_DRILL_MINIO_PORT:-59006}:9000"

volumes:
  db-data:
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:?compose project required}_seaweedfs-data
