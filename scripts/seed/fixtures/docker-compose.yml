name: bodour-production-seed-drill

services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: production-seed-drill-password
      POSTGRES_DB: bodour
    ports:
      - "${PRODUCTION_SEED_DB_PORT:-55437}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bodour"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Extends the same SeaweedFS definition every tier uses (Owner decision,
  # 2026-09-20) rather than hand-rolling a second one; only credentials and
  # the loopback port are fixture-specific.
  minio:
    extends:
      file: ../../../docker-compose.yml
      service: minio
    environment:
      AWS_ACCESS_KEY_ID: production-seed-fixture
      AWS_SECRET_ACCESS_KEY: production-seed-fixture-secret
    ports:
      - "${PRODUCTION_SEED_MINIO_PORT:-59004}:9000"

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://production-seed-fixture:production-seed-fixture-secret@minio:9000
    entrypoint: >
      /bin/sh -c "
      mc mb --ignore-existing local/public &&
      mc mb --ignore-existing local/private &&
      mc mb --ignore-existing local/recordings-staging
      "

volumes:
  db-data:
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:?compose project required}_seaweedfs-data
