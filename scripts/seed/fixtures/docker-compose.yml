name: bodour-production-seed-drill

services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: production-seed-drill-password
      POSTGRES_DB: bodour
    ports:
      - "${PRODUCTION_SEED_DB_PORT:-25437}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bodour"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Extends the same SeaweedFS definition every tier uses (Owner decision,
  # 2026-09-20) rather than hand-rolling a second one; only credentials and
  # the loopback port are fixture-specific.
  minio:
    extends:
      file: ../../../docker-compose.yml
      service: minio
    environment:
      AWS_ACCESS_KEY_ID: production-seed-fixture
      AWS_SECRET_ACCESS_KEY: production-seed-fixture-secret
    ports:
      - "${PRODUCTION_SEED_MINIO_PORT:-29004}:9000"

volumes:
  db-data:
  minio-data:
    name: ${COMPOSE_PROJECT_NAME:?compose project required}_seaweedfs-data
