name: bodour-production-seed-drill

services:
  db:
    image: postgres:18.4
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: production-seed-drill-password
      POSTGRES_DB: bodour
    ports:
      - "${PRODUCTION_SEED_DB_PORT:-55437}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d bodour"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data
    environment:
      MINIO_ROOT_USER: production-seed-fixture
      MINIO_ROOT_PASSWORD: production-seed-fixture-secret
    ports:
      - "${PRODUCTION_SEED_MINIO_PORT:-59004}:9000"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://production-seed-fixture:production-seed-fixture-secret@minio:9000
    entrypoint: >
      /bin/sh -c "
      mc mb --ignore-existing local/public &&
      mc mb --ignore-existing local/private &&
      mc mb --ignore-existing local/recordings-staging
      "

volumes:
  db-data:
  minio-data:
