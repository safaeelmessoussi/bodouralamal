<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الخدمة غير متاحة مؤقتاً</title>
    <!--
      The styling was an inline <style> block, which the §3.1 CSP
      (`style-src 'self'`) has been refusing all along — so this page has
      rendered unstyled wherever it rendered at all. Same stylesheet as
      `/clear-cache`, and for the same reason: it is a plain file in the build,
      not a content-hashed asset, so it survives a page that serves when the
      application cannot.
    -->
    <link rel="stylesheet" href="/recovery.css" />
  </head>
  <body>
    <!--
      TD-16: served when the API is unreachable, so a user never meets a raw
      502/504. Static and dependency-free by design — it must render when the
      rest of the platform cannot. Text is Arabic-only, matching the launch
      locale (§6); it is intentionally outside the i18n catalog because no
      application JavaScript is running at this point.
    -->
    <main>
      <h1>الخدمة غير متاحة مؤقتاً</h1>
      <p>
        نقوم حالياً بأعمال صيانة أو نواجه عطلاً تقنياً مؤقتاً.
        يرجى المحاولة مرة أخرى بعد قليل.
      </p>
    </main>
  </body>
</html>
