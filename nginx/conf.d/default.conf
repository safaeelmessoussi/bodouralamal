# HTTP server (SRS §3.1).
#
# Local development terminates here: browsers treat http://localhost as a
# secure context, so the TD-12 `HttpOnly; Secure; SameSite=Lax` refresh cookie
# is delivered normally without weakening a single attribute. §19.0 prohibits
# environment-conditional cookie downgrades (SameSite=None, dropping Secure) —
# none are needed or present.
#
# In production this block keeps serving the ACME challenge and redirects
# everything else to TLS; activate that behavior together with the TLS server
# by following nginx/conf.d/tls.conf.example (§19.1).

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge (certbot webroot, §19.1).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/snippets/app-routing.conf;
}
