# Local Development HTTP server (SRS §19.0).
#
# Browsers treat http://localhost as a secure context, so the TD-12
# `HttpOnly; Secure; SameSite=Lax` refresh cookie is delivered without weakening
# an attribute. This file is mounted only by docker-compose.dev.yml; release
# hosts retain nginx/conf.d/default.conf's fail-closed HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    include /etc/nginx/snippets/app-routing.conf;
}
