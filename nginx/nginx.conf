# بذور الأمل — Nginx main configuration (SRS §3.1, TD-13, TD-16).
#
# Same-origin path routing is MANDATORY (§3.1, §20 rule 15): the React client
# (`/`), the API (`/api/v1/`), and storage (`/storage/`) are served from ONE
# origin so the `SameSite=Lax` refresh cookie stays first-party. Splitting them
# across subdomains/origins breaks cookie delivery and is prohibited.

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # TD-14: structured logs. request_id is generated here when the client did
    # not supply one, and forwarded to the API so a user-reported error is
    # traceable end-to-end. No PII is logged (no names/phones/emails, and
    # never the X-Active-Child-ID value).
    map $http_x_request_id $request_id_final {
        ""      $request_id;
        default $http_x_request_id;
    }

    log_format json_combined escape=json
      '{"time":"$time_iso8601","request_id":"$request_id_final",'
      '"remote_addr":"$remote_addr","method":"$request_method","uri":"$uri",'
      '"status":$status,"bytes":$body_bytes_sent,'
      '"request_time":$request_time,"upstream_time":"$upstream_response_time"}';

    access_log  /var/log/nginx/access.log  json_combined;

    sendfile        on;
    keepalive_timeout  65;
    server_tokens   off;

    # Keep nginx-generated redirects (directory trailing-slash and friends)
    # relative, so they cannot reconstruct a wrong scheme or leak an internal
    # port behind TLS termination. Explicit `return 302 /path` redirects are
    # unaffected by these directives — nginx builds those from the request's
    # own $scheme, which is correct in both server blocks.
    absolute_redirect off;
    port_in_redirect  off;

    # §3.1 upload passthrough: the body limit stays SMALL globally and is
    # raised ONLY on /storage/ (110m). Never raise this globally to "fix"
    # uploads — /api/v1/ is pinned to 2m in the routing snippet.
    client_max_body_size 1m;

    # TD-13 rate limits. The zone definitions live in their own snippet so the
    # dev overlay can replace exactly them — see nginx/snippets/rate-limits.conf.
    include /etc/nginx/snippets/rate-limits.conf;

    # §3.1: static assets gzipped for weak mobile links. Brotli is NOT compiled
    # into the stock nginx:stable-alpine image; if a brotli-enabled build is
    # adopted later, add brotli directives here (the SRS treats it as optional:
    # "and brotli if available").
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml font/woff font/woff2;

    # Docker's embedded DNS. Referencing upstreams through variables (see the
    # routing snippet) defers resolution to request time, so Nginx still starts
    # and serves the static client shell when the API container is down —
    # required by the TD-16 degraded-operation matrix.
    resolver 127.0.0.11 ipv6=off valid=10s;

    include /etc/nginx/conf.d/*.conf;
}
