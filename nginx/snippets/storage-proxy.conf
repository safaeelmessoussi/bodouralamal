# Shared MinIO proxy mechanics. Both the database-authorized public-read
# location and the signed/private fallback include this exact block, so a
# safeguarding check cannot drift from the SigV4, upload, timeout or CSP rules.

# Signature integrity: presigned URLs are signed against the PUBLIC origin,
# so the proxied request must reach MinIO with the /storage prefix stripped and
# the Host preserved as the public host used for signing.
# P0.1 defence in depth for GHSA-hv4r-mvr4-25vw. The pinned final MinIO OSS
# release has no patched successor in that line, so reject the vendor-named
# unsigned streaming-trailer mode at the only published object-store boundary.
# The ordinary hashed payload modes and the signed streaming-trailer mode do
# not match this value; presigned GET/PUT therefore keep their exact SigV4
# request semantics. A private status dispatch makes the denial observably
# Nginx-owned instead of relying on a response MinIO might also emit.
error_page 418 = @storage_unsigned_trailer_denied;
if ($http_x_amz_content_sha256 ~* "STREAMING-UNSIGNED-PAYLOAD-TRAILER") { return 418; }

# Authorized public reads carry an internal-only dispatch prefix; both forms
# resolve to the identical MinIO canonical path before proxying. Keep this
# terminating rewrite after every edge-policy `if`: its `break` stops later
# rewrite-module directives in this included location.
rewrite ^/(?:_storage_public_read/)?storage/(.*)$ /$1 break;

proxy_pass $minio_upstream;
# SigV4 signs the exact Host field, including a non-default port. `$host`
# normalises that port away; `$http_host` preserves the browser's signed value.
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# §3.1 upload passthrough. The API path keeps its separate 2 MB limit.
client_max_body_size     110m;
proxy_request_buffering  off;

proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_read_timeout    300s;
proxy_send_timeout    300s;

# Stale public links and denied private reads land on the platform page, never
# on raw S3 XML. @storage_denied preserves real errors for non-read methods.
proxy_intercept_errors on;
error_page 403 404 = @storage_denied;

# Stored objects may be framed only by this origin (§14.6 PDF preview). Declaring
# headers here replaces server-level inheritance, so nosniff is restated too.
add_header Content-Security-Policy "default-src 'self'; media-src 'self'; img-src 'self'; connect-src 'self' https://accounts.google.com; script-src 'self'; style-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security $hsts always;
