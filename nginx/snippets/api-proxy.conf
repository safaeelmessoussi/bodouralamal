# Shared API proxy behavior (SRS §3.1, TD-3.8, TD-13, TD-16).
# Included by every /api/v1/ location so rate-limit tiers differ but proxy
# semantics never drift apart.

proxy_pass $api_upstream;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
# TD-14: propagate the request id so a user-reported error is traceable from
# the browser through Nginx into the API's structured logs and job records.
proxy_set_header X-Request-Id      $request_id;

proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_read_timeout    60s;
proxy_send_timeout    60s;

# §3.1: the API body limit stays at 2m. Only /storage/ is raised (to 110m).
client_max_body_size 2m;

# proxy_intercept_errors is deliberately LEFT OFF here. The API returns its own
# 5xx responses inside the TD-3.8 envelope — notably the legitimate
# `503 SERVICE_UNAVAILABLE` of the TD-16 degraded-operation matrix (MinIO or
# OAuth down). Intercepting those would replace a contract-conformant JSON
# body with an HTML page and break the API contract. The error_page rules below
# therefore fire only for errors Nginx itself generates when the upstream is
# unreachable, which is exactly TD-16's "never raw 502 pages" requirement.
error_page 502 504 = @api_unavailable;
error_page 429     = @api_rate_limited;
# TD-9 caps are also enforced in the app via Zod, but a body exceeding
# client_max_body_size is rejected by Nginx before the API ever sees it — that
# rejection must still carry the canonical envelope and code (TD-3.8).
error_page 413     = @api_payload_too_large;
