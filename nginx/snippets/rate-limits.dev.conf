# TD-13 rate limits — LOCAL DEVELOPMENT ONLY. Never mounted in production.
#
# docker-compose.dev.yml mounts this file over `rate-limits.conf`, replacing the
# zone *rates* and nothing else: the `limit_req` directives, their zones, their
# bursts and every routing decision in app-routing.conf stay exactly as
# production has them, so the limiter is still exercised — it simply has a
# ceiling a test harness cannot reach.
#
# WHY THIS EXISTS (2026-08-05). The integration suite ran green in isolation and
# failed intermittently in the full sweep, always inside
# `auth-refresh.http.integration.test.ts`, on different tests each run. The cause
# was not the CSRF logic and not cross-file data interference: it was
# **`429 RATE_LIMITED`**. `limit_req_zone` keys on `$binary_remote_addr`, and the
# entire suite — 688 tests across 38 files, run in parallel — arrives from one
# host. The production ceiling of 120 r/m models a *person* using the platform;
# it does not model a test runner, and as the suite grew it started tripping.
#
# WHY NOT THE OBVIOUS ALTERNATIVES:
#   * Retrying on 429 in the tests would hide the interference and let it
#     resurface in a suite whose failure is not so obviously spurious.
#   * Removing `limit_req` from the dev routing would stop exercising the
#     limiter at all, so a misrouted zone would go unnoticed until production.
#   * Raising the production numbers would change TD-13's normative values to
#     accommodate a test harness, which is the wrong thing to bend.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=6000r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=60000r/m;
limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=6000r/m;
limit_req_status 429;
