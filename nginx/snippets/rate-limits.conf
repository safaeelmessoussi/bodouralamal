# TD-13 rate limits — the PRODUCTION values.
#
# Extracted from nginx.conf into their own snippet so the local-development
# overlay can replace this one file (see docker-compose.dev.yml) without
# duplicating nginx.conf or touching a single production number. A second copy
# of this config would be the usual outcome, and the copy is what drifts.
#
# TD-13 rate limits (starting values, tunable).
#   auth endpoints  10 req/min/IP
#   general API    120 req/min/IP
# Limits live here — at the proxy, not in process memory — so they survive
# container restarts and stay correct if the API is ever scaled out (§3.1).
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=120r/m;
# Edge guard for upload initiation. TD-13 asks for "30/hour/user", which
# Nginx cannot express on EITHER axis (recorded in docs/CHANGES.log,
# flagged to the Document Owner):
#   * per-user — limit_req keys on connection variables; the JWT subject is
#     unreachable without the njs/lua module, and $http_authorization is
#     truncated at 255 bytes so it cannot key users reliably;
#   * per-hour — limit_req supports only r/s and r/m, so 30/h (0.5/min) has
#     no representation; 1r/m (=60/h) is the closest expressible floor.
# This zone is therefore a coarse per-IP burst guard only. The authoritative
# 30/hour/user quota is enforced in the application at M6, where the user
# identity is known — the Nginx layer keeps the edge protection §3.1 asks
# for without pretending to be the quota.
limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=1r/m;
limit_req_status 429;
