# Local-development media origin (R98) — mounted over `media-origin.conf` by
# docker-compose.dev.yml, the same mechanism the dev rate limits use.
#
# The `livekit` dev-overlay container, on the port the BROWSER reaches it at.
# `ws://`, not `wss://`: development serves the client over plain HTTP, and a
# secure socket from an insecure page is refused for the opposite reason.
#
# **Both schemes** — the client validates over HTTP before upgrading, and CSP
# treats the two as different sources. See `media-origin.conf`.
set $media_origin "ws://127.0.0.1:7880 http://127.0.0.1:7880";
