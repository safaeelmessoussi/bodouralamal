# Same-origin path routing, shared by the HTTP and TLS server blocks so both
# serve byte-identical behavior (SRS §3.1; §19.0 forbids environment-conditional
# divergence in security attributes).
#
#   /           → React client (static SPA)
#   /api/v1/    → Express API
#   /storage/   → MinIO
#   /healthz    → API health endpoint (TD-14; §19.1 step 8 curls it)

# Upstreams are referenced through variables so DNS resolves per request
# instead of at startup: Nginx then still boots and serves the client shell
# while the API container is down (TD-16).
set $api_upstream   http://api:3000;
set $minio_upstream http://minio:9000;

# **R98 — the online-class media server's origin**, defined in ONE place and
# referenced by every CSP below. A class delivered عن بُعد connects the browser
# straight to it, so `connect-src 'self'` alone refuses the classroom before the
# request reaches the network — a failure only a real browser can see. Empty
# unless the deployment runs online classes.
include snippets/media-origin.conf;

# §3.1 security headers. `always` so they apply to error responses too.
# CSP: default-src 'self'; media/img/connect limited to 'self' (which covers
# /storage/ by same-origin) plus the Google OAuth endpoints and, when the
# association runs online classes, the media server; frame-ancestors 'none'.
# NOTE for the frontend build: img-src is exactly 'self' with no `data:`, so
# Vite must emit no inlined data-URI assets (assetsInlineLimit: 0).
#
# **`blob:` on media-src** is what lets a live audio or video track be attached
# to a player element; it names no external origin and widens nothing.
add_header Content-Security-Policy "default-src 'self'; media-src 'self' blob:; img-src 'self'; connect-src 'self' https://accounts.google.com $media_origin; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security $hsts always;

# CORS is deliberately absent (§3.1, Revision 12): client, API, and storage
# share one origin, so cross-origin requests are not part of normal operation.
# Never add Access-Control-Allow-Origin here, in any environment — Vercel
# staging runs on MSW mocks and calls no real backend (§19.0).

# --- Health (TD-14) --------------------------------------------------------
location = /healthz {
    proxy_pass $api_upstream;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id_final;
    access_log off;

    # A totally unreachable API must still answer in the canonical envelope
    # rather than a raw 502 (TD-16). The API's own 503-with-component-detail
    # response (TD-14) passes through untouched, since intercept is off.
    error_page 502 504 = @api_unavailable;
}

# --- Session upkeep: the GENERAL API limit, not the login one --------------
#
# `/auth/refresh` and `/auth/logout` are **routine session operations**, not
# credential guesses. The SPA calls refresh on **every fresh page load** (no
# in-memory token → try the cookie), so at the login zone's 10 r/m + burst 5 a
# tester exhausted the bucket after **six page loads** and then met
# `RATE_LIMITED` for the next half-minute. Measured, not assumed: six requests
# succeeded and the seventh was refused.
#
# **No TD-13 number changes here.** These two endpoints are simply classified
# under the general-API limit TD-13 already states (120 r/m/IP) rather than the
# brute-force limit meant for credential presentation. That is the honest
# reading: TD-13's 10 r/m protects *guessing*, and neither of these can be
# guessed — refresh presents a cookie the server itself issued and rotates, and
# TD-12's reuse detection revokes the entire session on replay, which is a far
# stronger control than a request counter.
#
# Ruled out while diagnosing: React StrictMode's double effect invocation (the
# client's single-flight promise collapses it to one network call) and
# duplicate submissions (the form disables its button while in flight).
location = /api/v1/auth/refresh {
    limit_req zone=api_zone burst=20 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

location = /api/v1/auth/logout {
    limit_req zone=api_zone burst=20 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

# --- Role switching: NOT a credential surface (SRS R60.3) -------------------
# `location /api/v1/auth/` below applies auth_zone at 10 r/m — the brute-force
# limit. Switching roles presents no credential: the caller is already
# authenticated and is choosing between roles the server issued them. Leaving it
# in that zone would rate-limit the feature's own stated purpose, since testing
# the platform as each role means switching repeatedly, and several staff behind
# one office IP share the counter. Same reasoning and same treatment as
# /auth/refresh and /auth/logout above.
location = /api/v1/auth/switch-role {
    limit_req zone=api_zone burst=20 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

# --- Login: the brute-force surface, tighter limit (TD-13: 10 req/min/IP) ---
# Everything else under /auth/ — the OAuth entry and callback — is where a
# credential is actually presented, and keeps TD-13's 10 r/m unchanged.
location /api/v1/auth/ {
    limit_req zone=auth_zone burst=5 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

# --- Upload initiation: edge guard (see nginx.conf note; TD-13) ------------
location = /api/v1/uploads/initiate {
    limit_req zone=upload_zone burst=10 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

# --- General API (TD-13: 120 req/min/IP) -----------------------------------
location /api/v1/ {
    limit_req zone=api_zone burst=20 nodelay;
    include /etc/nginx/snippets/api-proxy.conf;
}

# --- Storage proxy (§3.1) --------------------------------------------------
# Production publishes Nginx only; MinIO stays on the container network. The
# public bucket can therefore retain anonymous S3 semantics while every external
# GET/HEAD is authorized against the current exact database coordinate.
location = /_storage_public_authorize {
    internal;
    proxy_pass $api_upstream/internal/storage/public-authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-URI $storage_original_uri;
}

# A bucket is not an object. Exact locations match with or without query
# parameters, so neither spelling can fall through to the generic S3 proxy and
# become ListBucket (or another bucket-level operation). Do not redirect the
# slashless form: carrying its query onto another storage path would recreate
# the exposure this denial closes.
location = /storage/public  { return 403; }
location = /storage/public/ { return 403; }

# Browser PUT capabilities target this disposable namespace and no database row
# ever names it. Keep auth_request away from the upload body; MinIO validates the
# unchanged SigV4 method/path/query. PUT is the complete external method
# allowlist here: current uploads need it, while every read and every S3
# multipart/control operation is unsupported. GET/HEAD retain the friendly
# unavailable-page behavior; other methods stop at Nginx with 405.
location ^~ /storage/public/staging/ {
    if ($request_method !~ ^(GET|HEAD|PUT)$) { return 405; }
    if ($request_method = GET)  { return 403; }
    if ($request_method = HEAD) { return 403; }
    include /etc/nginx/snippets/storage-proxy.conf;
}

location ^~ /storage/public/ {
    # Route reads into the database-authorized internal location. PUT alone stays
    # on the unchanged SigV4 path so still-live pre-R103 canonical capabilities
    # can expire normally; current code mints staging PUTs only. Rejecting every
    # other method here prevents S3 Select and bucket/object control operations
    # from using the public bucket policy as a second read or mutation path.
    if ($request_method !~ ^(GET|HEAD|PUT)$) { return 405; }
    if ($request_method = GET)  { rewrite ^/storage/(.*)$ /_storage_public_read/storage/$1 last; }
    if ($request_method = HEAD) { rewrite ^/storage/(.*)$ /_storage_public_read/storage/$1 last; }
    include /etc/nginx/snippets/storage-proxy.conf;
}

location ^~ /_storage_public_read/storage/public/ {
    internal;
    # Every canonical public read needs a current exact database coordinate.
    set $storage_original_uri $request_uri;
    auth_request /_storage_public_authorize;
    include /etc/nginx/snippets/storage-proxy.conf;
}

location ^~ /storage/ {
    include /etc/nginx/snippets/storage-proxy.conf;
}

# §3.1's friendly-page mapping describes a *user following a stale cached
# link* — a browser navigation. Applying it to every method would break
# uploads: a rejected presigned PUT would answer 302 instead of a real error,
# the client would follow the redirect, and the FileUploader would surface a
# nonsense status instead of a retryable failure (§14.3, §14.4, R-9). So the
# friendly page is for GET/HEAD only; everything else gets the true status.
# `if` with a bare `return` is the documented-safe use of `if` in nginx.
location @storage_denied {
    if ($request_method = GET)  { return 302 /content-unavailable; }
    if ($request_method = HEAD) { return 302 /content-unavailable; }
    return 403;
}

# Named internal target for the shared P0.1 object-store edge filter. The
# marker is deliberate test evidence that the request stopped at Nginx rather
# than receiving a coincidentally similar MinIO rejection.
location @storage_unsigned_trailer_denied {
    default_type text/plain;
    add_header X-Bodour-Storage-Policy "unsigned-trailer-denied" always;
    add_header Content-Security-Policy "default-src 'self'; media-src 'self'; img-src 'self'; connect-src 'self' https://accounts.google.com; script-src 'self'; style-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security $hsts always;
    return 403;
}

# API failures answered in the TD-3.8 envelope, never as an HTML page: an API
# caller is a fetch client and every non-2xx response must carry the canonical
# shape with a machine-readable `code` and the traceable `request_id` (TD-14).
location @api_unavailable {
    default_type application/json;
    return 503 '{"error":{"code":"SERVICE_UNAVAILABLE","message_key":"errors.service_unavailable","message":"الخدمة غير متاحة مؤقتاً. يرجى المحاولة بعد قليل.","details":{},"request_id":"$request_id_final"}}';
}

location @api_rate_limited {
    default_type application/json;
    return 429 '{"error":{"code":"RATE_LIMITED","message_key":"errors.rate_limited","message":"عدد كبير من المحاولات. يرجى المحاولة بعد قليل.","details":{},"request_id":"$request_id_final"}}';
}

location @api_payload_too_large {
    default_type application/json;
    return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message_key":"errors.payload_too_large","message":"حجم الملف أكبر من الحد المسموح به.","details":{},"request_id":"$request_id_final"}}';
}

# --- React client (SPA) ----------------------------------------------------
#
# CACHING: the shell must revalidate, the hashed assets never need to.
#
# This pairing is not an optimisation — without it **a deployment does not
# reach the people already using the site.** `index.html` was served with no
# `Cache-Control` at all, so browsers applied *heuristic* caching (commonly a
# fraction of the time since `Last-Modified`) and a returning visitor kept
# executing the previous bundle. Because Vite emits content-hashed filenames,
# that stale shell also pointed at the stale JS, which the browser likewise had
# cached — so the entire old application ran from cache with no error anywhere.
#
# It produced a genuinely confusing failure: a form rendered with last week's
# fields, posting last week's payload, refused by a server that had correctly
# moved on. Both halves looked like application bugs and neither was.
location = /index.html {
    root /usr/share/nginx/html;
    # `no-cache` means "revalidate before reuse", NOT "do not store" — the ETag
    # makes that a 304 in the common case, so the cost is one conditional
    # request and the guarantee is that a deploy takes effect immediately.
    add_header Cache-Control "no-cache" always;
    # `always` on the security headers too: add_header does not inherit into a
    # location that declares its own (§3.1, §19.0 — no divergence).
    add_header Content-Security-Policy "default-src 'self'; media-src 'self' blob:; img-src 'self'; connect-src 'self' https://accounts.google.com $media_origin; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
    add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security $hsts always;
}

# Content-hashed build output: the filename changes whenever the bytes do, so
# the response may be cached permanently. `immutable` additionally tells the
# browser not to revalidate even on a forced reload.
location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'self'; media-src 'self' blob:; img-src 'self'; connect-src 'self' https://accounts.google.com $media_origin; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
    add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security $hsts always;
}

location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;

    # Every SPA route serves the shell, so the same revalidation rule applies:
    # `/register` must not be answerable from a week-old cache either.
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'self'; media-src 'self' blob:; img-src 'self'; connect-src 'self' https://accounts.google.com $media_origin; script-src 'self'; style-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://accounts.google.com" always;
    add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security $hsts always;

    # TD-16: when the API is unreachable Nginx generates these itself; the
    # client shell keeps serving and users get a friendly interstitial.
    error_page 502 503 504 /maintenance.html;
}

location = /maintenance.html {
    root /usr/share/nginx/errors;
    internal;
}
