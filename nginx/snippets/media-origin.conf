# The online-class media server's origin, for the CSP `connect-src` (SRS R98).
#
# WHY THIS FILE EXISTS
# --------------------
# §3.1's CSP is `default-src 'self'` with `connect-src 'self'` plus the Google
# OAuth endpoints. A class delivered عن بُعد connects the BROWSER directly to a
# media server on another origin, so without an entry here the classroom cannot
# open at all — the page loads, the credential is minted, and the connection is
# refused by the browser before it reaches the network.
#
# That is not a hypothetical: it is exactly how it failed the first time, and
# **nothing but a real browser could have found it.** Neither typechecker, no
# unit test and no HTTP integration test can see a CSP.
#
# WHAT IT IS SET TO (SRS Revision 164)
# ------------------------------------
# The media server is **self-hosted and same-origin**: the browser's signalling
# socket is `wss://<this host>/rtc`, proxied by this Nginx (app-routing.conf).
# `connect-src 'self'` already covers the plain-HTTPS validation request the
# client makes first; the socket is named explicitly because browsers have not
# all agreed that `'self'` also means `wss:` on the same host.
#
# **`$host`, never a hand-written domain.** Revisions before 164 expected an
# operator to write a provider's origin here per deployment, in both schemes.
# There is no third-party origin any more — beneficiaries' media never leaves
# this infrastructure — so one line is right for every release tier and nobody
# edits this file on a host.
#
# Local development mounts `media-origin.dev.conf` over this file
# (docker-compose.dev.yml), exactly as the rate limits do, because its edge is
# plain HTTP and the socket is therefore `ws:`.
set $media_origin "wss://$host";
