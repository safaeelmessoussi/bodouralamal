# The online-class media server's origin, for the CSP `connect-src` (SRS R98).
#
# WHY THIS FILE EXISTS
# --------------------
# §3.1's CSP is `default-src 'self'` with `connect-src 'self'` plus the Google
# OAuth endpoints. A class delivered عن بُعد connects the BROWSER directly to a
# media server on another origin, so without an entry here the classroom cannot
# open at all — the page loads, the credential is minted, and the connection is
# refused by the browser before it reaches the network.
#
# That is not a hypothetical: it is exactly how it failed the first time, and
# **nothing but a real browser could have found it.** Neither typechecker, no
# unit test and no HTTP integration test can see a CSP.
#
# WHAT TO SET
# -----------
# The origin of `LIVEKIT_URL` (TD-13) **in BOTH schemes**, space-separated:
#
#     set $media_origin "wss://bodour.livekit.cloud https://bodour.livekit.cloud";
#
# **Both, and this is the trap.** The client validates the connection over
# ordinary HTTPS *before* upgrading to a socket, and CSP treats `wss:` and
# `https:` as different sources — so listing only the socket origin produces
# «could not establish signal connection: Failed to fetch» with **no CSP
# violation event at all**, because the blocked request is the HTTP one. That is
# how it failed here, and it cost a full debugging pass.
#
# **Empty is the correct default.** An association running no online classes
# adds nothing to its CSP, which is the right posture for a directive whose
# whole purpose is to stay as narrow as the deployment allows. The classroom
# then never opens — and it never would have, since `LIVEKIT_*` would also be
# unset and the join endpoint answers `503`.
#
# Local development mounts `media-origin.dev.conf` over this file
# (docker-compose.dev.yml), exactly as the rate limits do.
set $media_origin "";
